<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartoonify AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark custom-nav">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            🎨 Cartoonify
        </a>

        <div class="ms-auto">
            <button class="btn btn-outline-light">
                Light
            </button>
        </div>
    </div>
</nav>

<!-- Hero -->
<section class="hero text-center">
    <h1>Cartoonify Your Image</h1>
    <p>Transform your photos into stunning cartoon art using AI-powered processing.</p>
</section>

<!-- Main Card -->
<div class="container pb-5">

    <div class="row glass-card">

        <!-- Upload Section -->
        <div class="col-md-4 upload-side">

            <h4>📤 Upload Image</h4>

            <form method="POST" enctype="multipart/form-data">

                <div class="upload-box">
                    <input type="file" name="image" required>
                </div>

                <button class="btn cartoon-btn w-100 mt-3">
                    Cartoonify Image
                </button>

            </form>

            <div class="tips mt-4">
                <h5>✨ Tips</h5>

                <ul>
                    <li>Use High Quality Images</li>
                    <li>Good Lighting</li>
                    <li>Clear Subject</li>
                </ul>
            </div>

        </div>

        <!-- Preview Section -->
        <div class="col-md-8 preview-side">

            <h4>🖼 Preview</h4>

            <div class="preview-box">

                {% if image %}
                    <img src="{{ image }}" class="img-fluid">
                {% else %}
                    <div class="placeholder">
                        Your cartoon image will appear here
                    </div>
                {% endif %}

            </div>

        </div>

    </div>

</div>

</body>
</html>
